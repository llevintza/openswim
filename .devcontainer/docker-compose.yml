services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://openswim:openswim@postgres:5432/openswim?sslmode=disable
      JWT_SECRET: dev-only-change-me
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openswim
      POSTGRES_PASSWORD: openswim
      POSTGRES_DB: openswim
    ports:
      - "5432:5432"
    volumes:
      - openswim_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openswim -d openswim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openswim_pg:
